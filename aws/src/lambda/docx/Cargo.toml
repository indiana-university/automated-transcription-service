[package]
name = "transcribe-to-docx"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
aws-config = { version = "1.10.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = "1.139.0"
aws-sdk-transcribe = "1.110.0"
chrono = "0.4.42"
docx-rs = { version = "0.4.22", default-features = false }
lambda_runtime = "1.3.0"
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
url = "2.5.8"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
pretty_assertions = "1.4.1"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
