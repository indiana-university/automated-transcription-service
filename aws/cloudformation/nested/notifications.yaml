AWSTemplateFormatVersion: '2010-09-09'
Description: ATS SNS topic for transcription completion and error notifications.

Parameters:
  Prefix:
    Type: String
    Default: ats
    Description: Prefix used for resource naming

  Environment:
    Type: String
    Default: dev
    Description: Deployment environment tag value

Resources:

  NotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${Prefix}-notifications"
      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  TopicArn:
    Description: ARN of the ATS notifications SNS topic
    Value: !Ref NotificationsTopic

  TopicName:
    Description: Name of the ATS notifications SNS topic
    Value: !GetAtt NotificationsTopic.TopicName
