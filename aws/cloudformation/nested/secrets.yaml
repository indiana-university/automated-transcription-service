AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ATS Secrets Manager secrets for Teams and Slack webhook URLs.
  Resources are created conditionally based on the TeamsEnabled and SlackEnabled parameters.

Parameters:
  Prefix:
    Type: String
    Default: ats
    Description: Prefix used for resource naming

  TeamsEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Whether to create the Teams webhook secret

  SlackEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Whether to create the Slack webhook secret

  TeamsWebhook:
    Type: String
    Default: DISABLED
    NoEcho: true
    Description: Teams incoming webhook URL (stored in Secrets Manager)

  SlackWebhook:
    Type: String
    Default: DISABLED
    NoEcho: true
    Description: Slack incoming webhook URL (stored in Secrets Manager)

Conditions:
  TeamsEnabled: !Equals [!Ref TeamsEnabled, 'true']
  SlackEnabled: !Equals [!Ref SlackEnabled, 'true']

Resources:

  # ── Teams webhook secret ───────────────────────────────────────────────────────
  TeamsWebhookSecret:
    Type: AWS::SecretsManager::Secret
    Condition: TeamsEnabled
    Properties:
      Name: !Sub "${Prefix}-teams-webhook"
      Description: Teams webhook URL for ATS notifications
      SecretString: !Ref TeamsWebhook
      Tags:
        - Key: Project
          Value: ATS

  # ── Slack webhook secret ───────────────────────────────────────────────────────
  SlackWebhookSecret:
    Type: AWS::SecretsManager::Secret
    Condition: SlackEnabled
    Properties:
      Name: !Sub "${Prefix}-slack-webhook"
      Description: Slack webhook URL for ATS notifications
      SecretString: !Ref SlackWebhook
      Tags:
        - Key: Project
          Value: ATS

Outputs:
  TeamsSecretArn:
    Description: ARN of the Teams webhook secret (empty string when Teams is disabled)
    Value: !If [TeamsEnabled, !Ref TeamsWebhookSecret, '']

  SlackSecretArn:
    Description: ARN of the Slack webhook secret (empty string when Slack is disabled)
    Value: !If [SlackEnabled, !Ref SlackWebhookSecret, '']
